---
# Continuous integration for the Remote Energy Meter add-on.
#
# Security + quality gate: work lands on
# `dev` first; `main` only receives reviewed PR merges. Security is the #1
# priority: the `secrets` job (gitleaks, full history) and the `audit` job
# (runtime dependency advisories) hard-fail the pipeline.
#
# Requirement 1.1 (add-on manifest) is guarded by the add-on linter plus the
# schema-agreement test in the default suite; Requirement 1.2 (image entry point
# and exit-status propagation) by the image build plus the container-level
# integration tests; Requirement 10.2 (reference conformance suite) by the
# default suite, which collects `tests/conformance/`.
#
# Every check is its own job so a red run names what broke without anyone
# opening a log. `.githooks/pre-commit` runs the same gates locally.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repository, publishes a package,
# or reads a repository secret. Jobs that need more ask for it explicitly.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pyproject pins `requires-python = ">=3.12"`, ruff `target-version = "py312"`,
  # and mypy `python_version = "3.12"`. CI must not silently drift to a newer
  # interpreter than the tools are configured for.
  PYTHON_VERSION: "3.12"
  # Same as the local gates: bytecode written into `custom_components/` would make the
  # integration-package validator reject the package (tests/conftest.py also enforces it).
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action reads the PR's commit list on pull_request events.
    # Read-only scopes only; the token never gets write access.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      # Uses .gitleaks.toml (default ruleset, no allowlist) and .gitleaksignore
      # (commit-qualified fingerprints for two reviewed test fixtures).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  local-refs:
    name: Local-setup reference scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every file version, not just the tip, is published

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This repository is public: no private IPs, home/volume paths, LAN hostnames,
      # MAC addresses, or personal e-mail addresses (tools/check_local_refs.py).
      # Standard library only, so nothing is installed.
      - name: Tracked files
        run: python tools/check_local_refs.py

      - name: Full history
        run: python tools/check_local_refs.py --history

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Two separate steps on purpose: a formatting diff and a lint violation are
      # different fixes, and collapsing them hides one behind the other.
      - name: ruff check
        run: ruff check

      - name: ruff format --check
        run: ruff format --check

      - name: Validate the companion integration package
        run: python tools/validate_integration_package.py custom_components/remote_energy_meter

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # pyproject sets strict checking over backend source, tests, and the custom integration.
      # Lightweight local type stubs model Home Assistant's API without installing Core into this package.
      # `--strict` is still explicit so a future pyproject edit cannot weaken the gate.
      - name: mypy --strict
        run: mypy --strict

  test:
    name: pytest (unit, property, conformance) + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # pyproject registers the `integration` marker but does not deselect it in
      # `addopts`, so a bare `pytest` would also open real sockets, spawn a
      # Mosquitto subprocess, and build container images. Deselect it here and
      # let the `integration` job below run it deliberately, on a runner that has
      # the broker installed.
      #
      # Coverage gate: 80% lines+branches ([tool.coverage] in pyproject).
      - name: Run the default suite with the coverage gate
        run: pytest -m "not integration" --cov --cov-report=term

  integration:
    name: pytest -m integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The broker fixture skips itself with a clear message when the binary is
      # absent, which in CI would mean a silent hole rather than a failure.
      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto
          # The fixture starts its own broker on an ephemeral port, so the
          # service that apt auto-starts on 1883 is not wanted: leaving it up
          # would let a test pass against the wrong broker.
          sudo systemctl disable --now mosquitto || true
          mosquitto -h | head -n 1

      # The fixture's broker reads its generated config from pytest's tmp_path. If the
      # distribution's AppArmor profile confines mosquitto to /etc/mosquitto, that read is
      # denied ("Unable to open config file"). Report what is loaded, and only when a
      # mosquitto profile is enforced, switch it to complain mode on this throwaway runner.
      - name: Let the test broker read its tmp_path config (AppArmor)
        run: |
          sudo apt-get install -y --no-install-recommends apparmor-utils
          if sudo aa-status 2>/dev/null | grep -q mosquitto; then
            echo "mosquitto AppArmor profile is loaded:"; sudo aa-status | grep mosquitto
            sudo aa-complain /usr/sbin/mosquitto
          else
            echo "no mosquitto AppArmor profile is loaded"
          fi

      - name: Run the integration suite
        run: |
          set +e
          pytest -m integration
          status=$?
          # pytest exits 5 when it collected nothing. The integration suite is
          # spec tasks 15.1-15.6 and is not written yet, so today this job
          # legitimately collects zero tests; failing on that would leave CI red
          # for a reason nobody can act on. Every other non-zero status still
          # fails the job, and once 15.x lands this branch stops being taken.
          if [ "$status" -eq 5 ]; then
            echo "::notice title=No integration tests::pytest collected no tests matching -m integration (spec tasks 15.1-15.6 pending); treating exit code 5 as success."
            exit 0
          fi
          exit "$status"

  audit:
    name: Dependency audit (runtime deps, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      # Audit the hash-locked file the Dockerfile installs from: that is exactly what
      # ships, not a fresh resolution that may differ from the image's.
      - name: pip-audit the locked runtime set (any known vulnerability fails the job)
        run: pip-audit --strict --progress-spinner off --no-deps --require-hashes -r requirements.txt

      # The lock must still match pyproject's declared dependencies; a drift means
      # someone edited one without regenerating the other.
      - name: Lock file is consistent with pyproject.toml
        run: |
          python -m pip install "uv==0.11.8"
          uv pip compile pyproject.toml --python-version 3.12 --python-platform linux --generate-hashes -o /tmp/fresh.txt --quiet
          diff <(grep -vE '^(#|\s*$)' requirements.txt) <(grep -vE '^(#|\s*$)' /tmp/fresh.txt)

  addon-lint:
    name: add-on linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `path` is the action's only required input and points at the folder that
      # holds the manifest, not at `config.yaml` itself; the linter accepts
      # either `config.yaml` or `config.json` there.
      - name: Lint remote_energy_meter/config.yaml
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: "./remote_energy_meter"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [secrets, local-refs, lint, typecheck, test]
    # The aarch64 build runs under QEMU and may compile pydantic-core when no musl
    # wheel exists. Cap the job so a runaway build fails legibly.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One entry per architecture declared in `remote_energy_meter/config.yaml`.
        # `platform` is the Docker name for the same architecture.
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile's FROM is the single source of truth for the base image
      # (`tag@sha256:digest`, multi-arch). Supervisor builds from exactly that line.
      - name: Read the pinned base image from the Dockerfile
        id: base
        run: |
          # Match every FROM the Dockerfile parser would accept (any case, leading
          # whitespace) so an added stage or a re-cased line cannot slip past.
          froms=$(grep -Ei '^[[:space:]]*FROM[[:space:]]' remote_energy_meter/Dockerfile || true)
          count=$(printf '%s\n' "$froms" | grep -c . || true)
          [ "$count" -eq 1 ] || { echo "::error::expected exactly one FROM in the Dockerfile, found $count"; exit 1; }
          # Drop the instruction keyword and surrounding whitespace; keep the rest verbatim.
          image=$(printf '%s\n' "$froms" | sed -E 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+//; s/[[:space:]]+$//')
          case "$image" in
            --*|*[[:space:]]*) echo "::error::the Dockerfile FROM must be a bare image reference (no flags, no stage name): $image"; exit 1 ;;
          esac
          # The base tag is `<python minor>-<alpine>-<date>`; Dependabot proposes 3.13 tags
          # too, and the runtime interpreter must stay the one the tools are configured for
          # ($PYTHON_VERSION comes from the workflow-level env).
          tagged="${image%@*}"; tag="${tagged##*:}"; python_minor="${tag%%-*}"
          [ "$python_minor" = "$PYTHON_VERSION" ] || { echo "::error::base image tag '$tag' is Python '$python_minor', the workflow pins PYTHON_VERSION=$PYTHON_VERSION"; exit 1; }
          case "$image" in
            *@sha256:*) ;;
            *) echo "::error::the Dockerfile FROM is not pinned by digest: $image"; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The pinned digest must still be what the tag resolves to; otherwise the
      # image CI tests is not the image Supervisor will build for users.
      - name: Tag and digest agree
        env:
          IMAGE: ${{ steps.base.outputs.image }}
        run: |
          # Without pipefail a failed registry request leaves `actual` empty and the
          # step would report a "moved tag" instead of the curl error.
          set -o pipefail
          tagged="${IMAGE%@*}"; pinned="${IMAGE#*@}"
          repo="${tagged#ghcr.io/}"; repo="${repo%%:*}"; tag="${tagged##*:}"
          # jq ships on ubuntu-latest; this job has no other Python need, so no setup-python.
          token=$(curl -sSf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          actual=$(curl -sSfI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${tag}" | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
          echo "tag ${tagged} -> ${actual}"
          [ "${actual}" = "${pinned}" ] || { echo "::error::base image tag moved: pinned ${pinned}, registry has ${actual}"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: no registry login, no push, no credentials. The build context
      # is the repository root because the Dockerfile copies pyproject.toml,
      # requirements.txt, README.md, and src/ from there. `--load` puts the image
      # in the local daemon so the smoke test below can run it. The base image
      # comes from the Dockerfile's own FROM, exactly as Supervisor builds it.
      #
      # Values arrive through the environment rather than inline `${{ }}` so the
      # shell never has expression output spliced into it.
      - name: Build the ${{ matrix.arch }} image
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "$PLATFORM" \
            --file remote_energy_meter/Dockerfile \
            --build-arg "BUILD_ARCH=$BUILD_ARCH" \
            --build-arg "BUILD_VERSION=ci" \
            --tag "remote-energy-meter:ci-$BUILD_ARCH" \
            --cache-from "type=gha,scope=image-$BUILD_ARCH" \
            --cache-to "type=gha,mode=max,scope=image-$BUILD_ARCH" \
            --load \
            .

      # Native architecture only: under QEMU this would only re-test emulation.
      # Proves the runtime prerequisites the IPMI plugin depends on are really in
      # the image, that the whole application imports there, and that the labels
      # Supervisor reads were applied from the build arguments.
      - name: Smoke-test the image (ipmitool present, application imports, labels)
        if: matrix.arch == 'amd64'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint ipmitool "remote-energy-meter:ci-$BUILD_ARCH" -V
          docker run --rm --entrypoint python3 "remote-energy-meter:ci-$BUILD_ARCH" -c \
            "import remote_energy_meter.__main__, remote_energy_meter.plugins.ipmi.plugin as p; print('imports ok; sdr cache dir:', p.default_sdr_cache_dir())"
          arch=$(docker image inspect "remote-energy-meter:ci-$BUILD_ARCH" --format '{{index .Config.Labels "io.hass.arch"}}')
          [ "$arch" = "$BUILD_ARCH" ] || { echo "::error::io.hass.arch label is '$arch', expected '$BUILD_ARCH'"; exit 1; }
