# Keeps the pins this repository relies on current, one reviewable PR at a time.
# Every PR still goes through the full CI gate and branch protection on main.
version: 2
updates:
  - package-ecosystem: github-actions # SHA-pinned actions in .github/workflows
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    labels: [dependencies, ci]
  - package-ecosystem: pip # requirements.txt (hash-locked runtime) and pyproject dev pins
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    labels: [dependencies]
    # Two groups so a PR's title says what it touches: `runtime` bumps change the shipped
    # image and get a changelog entry; `dev-tools` bumps do not (steering workflow.md, step 4).
    groups:
      runtime: { dependency-type: production }
      dev-tools: { dependency-type: development }
  - package-ecosystem: docker # the digest-pinned FROM in remote_energy_meter/Dockerfile
    directory: /remote_energy_meter
    schedule: { interval: weekly }
    target-branch: dev
    labels: [dependencies, image]
    ignore:
      # Python is 3.12 everywhere; a Python-minor or Alpine bump of the base is a deliberate PR, not a digest refresh.
      - dependency-name: "ghcr.io/home-assistant/base-python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
